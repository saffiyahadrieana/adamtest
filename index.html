<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Iceberg AI Solutions — AI Receptionist Platform</title>
<style>
:root{
  --bg:#0A0A10; --bg-2:#14141F; --ink:#F1EEE7; --ink-soft:#A39DB0;
  --panel:rgba(255,255,255,.045); --panel-solid:#15151F; --line:rgba(255,255,255,.10);
  --gold:#D9BE8F; --gold-soft:#E9DCC2; --violet:#8E7CF0; --violet-deep:#6455C9; --rose:#E7A3A3;
  --radius:20px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;line-height:1.6;
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(142,124,240,.22), transparent 60%),
    radial-gradient(700px 500px at -10% 20%, rgba(217,190,143,.14), transparent 55%),
    linear-gradient(180deg,var(--bg),var(--bg-2));
  background-attachment:fixed;min-height:100vh;
}
h1,h2,h3{font-family:"Optima","Georgia","Times New Roman",serif;font-weight:500;margin:0 0 .3em;letter-spacing:.01em}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
.btn{border:none;border-radius:999px;padding:.75em 1.5em;font-size:.95rem;font-weight:600;transition:transform .15s,box-shadow .15s}
.btn:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,var(--gold),#C9A96A);color:#171208;box-shadow:0 6px 24px rgba(217,190,143,.25)}
.btn-primary:hover{box-shadow:0 8px 30px rgba(217,190,143,.4);transform:translateY(-1px)}
.btn-ghost{background:rgba(255,255,255,.04);color:var(--gold-soft);border:1px solid var(--line);backdrop-filter:blur(8px)}
.btn-ghost:hover{border-color:var(--gold)}
.btn-sm{padding:.45em 1.1em;font-size:.82rem}
input,select,textarea{font-family:inherit;font-size:.95rem;padding:.7em .85em;border:1px solid var(--line);border-radius:12px;width:100%;background:rgba(255,255,255,.04);color:var(--ink);backdrop-filter:blur(6px)}
input::placeholder,textarea::placeholder{color:#6E6980}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--violet);box-shadow:0 0 0 3px rgba(142,124,240,.22)}
select option{background:#171722;color:var(--ink)}
label{font-size:.78rem;color:var(--ink-soft);display:block;margin:.8em 0 .3em;font-weight:600;letter-spacing:.02em}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px;backdrop-filter:blur(16px);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.hide{display:none !important}
/* Nav */
.topbar{border-bottom:1px solid var(--line);background:rgba(10,10,16,.55);backdrop-filter:blur(18px);position:sticky;top:0;z-index:10}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;padding:16px 24px}
.brand{font-family:"Optima",Georgia,serif;font-size:1.35rem;font-weight:500;letter-spacing:.02em;font-style:italic}
.brand span{background:linear-gradient(120deg,var(--gold),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;font-style:normal}
/* Landing */
.hero{padding:110px 0 80px;text-align:left;position:relative}
.hero h1{font-size:3.1rem;max-width:13ch;line-height:1.12;background:linear-gradient(120deg,#fff 40%,var(--gold-soft) 75%,var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{max-width:54ch;color:var(--ink-soft);font-size:1.12rem}
.hero-actions{display:flex;gap:14px;margin-top:30px}
.biz-picker{display:flex;gap:16px;flex-wrap:wrap;margin-top:40px}
.biz-chip{border:1px solid var(--line);background:var(--panel);border-radius:18px;padding:20px 22px;cursor:pointer;min-width:230px;backdrop-filter:blur(14px);transition:border-color .2s,transform .2s}
.biz-chip:hover{border-color:var(--gold);transform:translateY(-3px)}
.biz-chip .cat{font-size:.72rem;color:var(--violet);font-weight:700;letter-spacing:.06em}
/* Dashboard layout */
.dash{display:flex;min-height:100vh}
.sidebar{width:232px;background:rgba(12,12,18,.6);backdrop-filter:blur(20px);border-right:1px solid var(--line);color:#fff;padding:24px 16px;flex-shrink:0}
.sidebar .brand{color:#fff;margin-bottom:26px;display:block}
.side-link{display:block;padding:.65em .9em;border-radius:12px;color:#C9C4D6;text-decoration:none;font-size:.9rem;margin-bottom:3px;background:none;border:none;width:100%;text-align:left;transition:background .15s}
.side-link:hover{background:rgba(255,255,255,.06)}
.side-link.active{background:linear-gradient(135deg,rgba(142,124,240,.35),rgba(217,190,143,.25));color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.main{flex:1;padding:32px 36px;max-width:920px}
.pagehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.pagehead p{color:var(--ink-soft);margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.list-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:none}
.badge{font-size:.7rem;font-weight:700;padding:.3em .75em;border-radius:999px;letter-spacing:.02em;white-space:nowrap}
.badge-pending{background:rgba(217,190,143,.2);color:var(--gold-soft)}
.badge-confirmed{background:rgba(142,124,240,.18);color:#C7BFFA}
.badge-declined{background:rgba(231,163,163,.18);color:var(--rose)}
.small{font-size:.82rem;color:var(--ink-soft)}
.svc-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.svc-row:last-child{border-bottom:none}
.hours-row{display:grid;grid-template-columns:100px 1fr auto;gap:10px;align-items:center;padding:7px 0}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:rgba(20,20,30,.9);border:1px solid var(--line);backdrop-filter:blur(14px);color:#fff;padding:13px 22px;border-radius:999px;font-size:.9rem;box-shadow:0 12px 32px rgba(0,0,0,.4);z-index:50}
/* Scheduled bookings table */
.sched-table{width:100%;border-collapse:collapse;font-size:.9rem}
.sched-table th{text-align:left;font-size:.72rem;letter-spacing:.04em;color:var(--ink-soft);font-weight:700;padding:0 10px 10px;text-transform:uppercase}
.sched-table td{padding:12px 10px;border-top:1px solid var(--line)}
.sched-table tr:hover td{background:rgba(255,255,255,.02)}
/* Chat */
.chat-wrap{max-width:580px;margin:0 auto;padding:28px 24px}
.chat-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.chat-avatar{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--violet),var(--gold));color:#14101f;display:flex;align-items:center;justify-content:center;font-weight:700;box-shadow:0 0 22px rgba(142,124,240,.5)}
.chat-box{background:var(--panel);border:1px solid var(--line);border-radius:24px;height:60vh;min-height:400px;display:flex;flex-direction:column;backdrop-filter:blur(18px);box-shadow:0 24px 70px rgba(0,0,0,.4);overflow:hidden}
.chat-msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:80%;padding:.7em 1em;border-radius:16px;font-size:.92rem;line-height:1.5}
.msg.ai{background:rgba(255,255,255,.05);align-self:flex-start;border:1px solid var(--line)}
.msg.user{background:linear-gradient(135deg,var(--violet),var(--violet-deep));color:#fff;align-self:flex-end;border-radius:16px 16px 4px 16px}
.chat-input{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line)}
.slots{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.slot-btn{border:1px solid var(--gold);color:var(--gold-soft);background:rgba(217,190,143,.08);border-radius:999px;padding:.45em .9em;font-size:.85rem;transition:background .15s}
.slot-btn:hover{background:var(--gold);color:#171208}
/* Modal */
.overlay{position:fixed;inset:0;background:rgba(6,6,10,.65);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--panel-solid);border:1px solid var(--line);border-radius:22px;padding:28px;max-width:440px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.modal .row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:.9rem;gap:12px}
@media(max-width:720px){.dash{flex-direction:column}.sidebar{width:100%;display:flex;overflow-x:auto;gap:4px}.sidebar .brand{display:none}.main{padding:22px}.grid2{grid-template-columns:1fr}.hero h1{font-size:2.1rem}.sched-table{display:block;overflow-x:auto;white-space:nowrap}}
/* Motion */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.view-in,.msg,.pop,.stat-card,.card,.biz-chip{animation:none !important}}
.view-in{animation:fadeUp 1.4s cubic-bezier(.16,1,.3,1) both}
.msg{animation:fadeUp 1.05s cubic-bezier(.16,1,.3,1) both}
.pop{animation:popIn .9s cubic-bezier(.16,1,.3,1) both}
.card{animation:fadeUp 1.25s cubic-bezier(.16,1,.3,1) both}
.biz-chip{animation:popIn 1s cubic-bezier(.16,1,.3,1) both}
.biz-chip:nth-child(2){animation-delay:.15s}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 20px;backdrop-filter:blur(14px);animation:popIn 1s cubic-bezier(.16,1,.3,1) both}
.stat-card:nth-child(2){animation-delay:.15s}
.stat-card:nth-child(3){animation-delay:.3s}
.stat-num{font-family:"Optima",Georgia,serif;font-size:2rem;background:linear-gradient(120deg,var(--gold-soft),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.quick-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.qa-btn{border:none;border-radius:999px;padding:.5em 1.1em;font-size:.85rem;font-weight:600;animation:popIn .8s cubic-bezier(.16,1,.3,1) both}
.qa-confirm{background:linear-gradient(135deg,var(--gold),#C9A96A);color:#171208}
.qa-human{background:rgba(255,255,255,.06);color:var(--ink);border:1px solid var(--line)}
.avatar-tag{margin-right:6px}
/* Intro: two doors ease open on a soft hinge, with a glowing seam and an expanding light */
#intro{position:fixed;inset:0;z-index:200;overflow:hidden;perspective:1600px}
#intro.intro-hide{visibility:hidden;transition:visibility 0s 2.3s}
.portal-glow{position:absolute;top:50%;left:50%;width:6px;height:6px;border-radius:50%;
  transform:translate(-50%,-50%) scale(1);
  background:radial-gradient(circle,rgba(255,255,255,.95),rgba(142,124,240,.5) 35%,rgba(217,190,143,.25) 60%,transparent 72%);
  opacity:0;transition:opacity .8s ease .1s,transform 2.4s cubic-bezier(.22,1,.36,1);z-index:1;filter:blur(1px)}
#intro.doors-open .portal-glow{opacity:1;transform:translate(-50%,-50%) scale(260)}
.seam{position:absolute;top:8%;bottom:8%;left:50%;width:1.5px;transform:translateX(-50%);
  background:linear-gradient(180deg,transparent,var(--gold-soft),var(--violet),transparent);
  box-shadow:0 0 30px 6px rgba(142,124,240,.45);opacity:0;
  transition:opacity 1.3s ease .5s;z-index:3}
#intro:not(.doors-open) .seam{opacity:.85}
#intro.doors-open .seam{transition:opacity .5s ease}
.door{position:absolute;top:0;bottom:0;width:50%;background:
    radial-gradient(600px 500px at 50% 50%,rgba(142,124,240,.14),transparent 65%),
    linear-gradient(180deg,var(--bg),var(--bg-2));
  transition:transform 2.4s cubic-bezier(.22,1,.36,1),filter 2.4s cubic-bezier(.22,1,.36,1);
  backface-visibility:hidden;z-index:2}
.door-left{left:0;border-right:1px solid rgba(255,255,255,.08);transform-origin:left center}
.door-right{right:0;border-left:1px solid rgba(255,255,255,.08);transform-origin:right center}
#intro.doors-open .door-left{transform:translateX(-102%) rotateY(-4deg);filter:brightness(.72)}
#intro.doors-open .door-right{transform:translateX(102%) rotateY(4deg);filter:brightness(.72)}
.intro-mark-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;
  transition:opacity 1.3s ease;z-index:4}
#intro.doors-open .intro-mark-wrap{opacity:0}
.intro-mark{font-family:"Optima",Georgia,serif;font-style:italic;font-size:2.3rem;letter-spacing:.02em;color:#fff;text-align:center;
  animation:introIn 2s cubic-bezier(.16,1,.3,1) both}
.intro-mark span{background:linear-gradient(120deg,var(--gold),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;font-style:normal}
.intro-line{width:64px;height:1px;margin:18px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent);
  animation:introLine 2s cubic-bezier(.16,1,.3,1) both .4s}
@keyframes introIn{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes introLine{from{opacity:0;transform:scaleX(0)}to{opacity:1;transform:scaleX(1)}}
</style>
</head>
<body>
<div id="intro">
  <div class="portal-glow"></div>
  <div class="door door-left"></div>
  <div class="door door-right"></div>
  <div class="seam"></div>
  <div class="intro-mark-wrap">
    <div class="intro-mark">Iceberg <span>AI Solutions</span></div>
    <div class="intro-line"></div>
  </div>
</div>
<div id="app"></div>

<script>
/* =========================================================================
   DATA LAYER — one record per business. This is the ONLY thing that changes
   from business to business; the AI engine and every screen below reads
   from it generically, so a new business needs zero new code.
   ========================================================================= */
let DB = {
  businesses: {
    salon_001: {
      id:"salon_001", name:"Glow Hair Salon", category:"Hair Salon",
      phone:"+60 3-1234 5678", address:"12 Jalan Ampang, Kuala Lumpur",
      description:"Modern cuts and colour in the heart of KL.",
      about:"Glow Hair Salon has been styling KL for over a decade, blending precision cuts with a relaxed, boutique experience.",
      image:null,
      hours:{Mon:"9:00 AM–7:00 PM",Tue:"9:00 AM–7:00 PM",Wed:"9:00 AM–7:00 PM",Thu:"9:00 AM–7:00 PM",Fri:"9:00 AM–8:00 PM",Sat:"9:00 AM–8:00 PM",Sun:"Closed"},
      services:[
        {id:"s1",name:"Haircut",price:40,duration:45},
        {id:"s2",name:"Hair Colour",price:120,duration:120},
        {id:"s3",name:"Hair Wash",price:20,duration:20}
      ],
      staff:[{id:"st1",name:"Mei Ling"},{id:"st2",name:"Aisyah"}],
      ai:{name:"Luna",personality:"Warm and efficient",languages:"English, Malay"},
      humanTransfer:{contact:"Mei Ling (Front Desk Lead)",phone:"+60 12-345 6789",email:"hello@glowhair.my",note:"Available during opening hours — usually replies within the hour."},
      notifyPhone:"+60 3-1234 5678", notifyEmail:"owner@glowhair.my",
      lat:3.1610, lng:101.7194,
      slots:["1:30 PM","4:00 PM"],
      bookings:[
        {id:"b1",customer:"Chong Wei",phone:"+60 12-000 1111",service:"Haircut",time:"Tomorrow 10:00 AM",status:"confirmed"}
      ],
      enquiries:[], aiEnquiries:0
    },
    spa_002: {
      id:"spa_002", name:"Elite Beauty Spa", category:"Spa & Wellness",
      phone:"+60 3-9876 5432", address:"88 Jalan Bukit Bintang, Kuala Lumpur",
      description:"A calm escape for massage, facials and mani-pedis.",
      about:"Elite Beauty Spa is a wellness retreat in Bukit Bintang, designed for unhurried self-care.",
      image:null,
      hours:{Mon:"10:00 AM–8:00 PM",Tue:"10:00 AM–8:00 PM",Wed:"10:00 AM–8:00 PM",Thu:"10:00 AM–8:00 PM",Fri:"10:00 AM–9:00 PM",Sat:"10:00 AM–9:00 PM",Sun:"11:00 AM–6:00 PM"},
      services:[
        {id:"s1",name:"Swedish Massage",price:150,duration:60},
        {id:"s2",name:"Facial Treatment",price:180,duration:75},
        {id:"s3",name:"Manicure",price:60,duration:40}
      ],
      staff:[{id:"st1",name:"Priya"},{id:"st2",name:"Farah"}],
      ai:{name:"Bella",personality:"Calm and reassuring",languages:"English, Malay, Mandarin"},
      humanTransfer:{contact:"Priya (Spa Manager)",phone:"+60 12-987 6543",email:"care@elitebeautyspa.my",note:"Our front desk team picks up enquiries between 10am–8pm daily."},
      notifyPhone:"+60 3-9876 5432", notifyEmail:"owner@elitebeautyspa.my",
      lat:3.1466, lng:101.7108,
      slots:["10:00 AM","1:30 PM","4:00 PM"],
      bookings:[], enquiries:[], aiEnquiries:0
    },
    rest_003: {
      id:"rest_003", name:"Warung Nasi Lemak Kita", category:"Restaurant",
      phone:"+60 3-2222 4444", address:"5 Jalan Sultan Ismail, Kuala Lumpur",
      description:"Classic Malaysian comfort food, cooked fresh daily.",
      about:"Warung Nasi Lemak Kita has served KL office workers and families since 2015 — familiar flavours, quick service, friendly faces.",
      image:null,
      hours:{Mon:"7:00 AM–9:00 PM",Tue:"7:00 AM–9:00 PM",Wed:"7:00 AM–9:00 PM",Thu:"7:00 AM–9:00 PM",Fri:"7:00 AM–10:00 PM",Sat:"7:00 AM–10:00 PM",Sun:"8:00 AM–4:00 PM"},
      services:[
        {id:"m1",name:"Nasi Lemak Ayam Goreng",price:12},
        {id:"m2",name:"Roti Canai (2pc)",price:5},
        {id:"m3",name:"Mee Goreng Mamak",price:9},
        {id:"m4",name:"Teh Tarik",price:3}
      ],
      staff:[{id:"st1",name:"Chef Azman"}],
      ai:{name:"Nova",personality:"Warm and inviting",languages:"English, Malay"},
      humanTransfer:{contact:"Azman (Owner)",phone:"+60 12-333 7777",email:"warung.nasilemakkita@gmail.com",note:"We'll call back within 30 minutes during opening hours."},
      notifyPhone:"+60 3-2222 4444", notifyEmail:"warung.nasilemakkita@gmail.com",
      lat:3.1478, lng:101.7113,
      slots:["12:00 PM","1:00 PM","7:00 PM"],
      bookings:[], enquiries:[], aiEnquiries:0
    }
  },
  defaultSlots:["10:00 AM","1:30 PM","4:00 PM"]
};

let STATE = { view:"landing", bizId:null, dashTab:"overview", chat:null, userLoc:null };

function biz(){ return DB.businesses[STATE.bizId]; }
function uid(p){ return p+"_"+Math.random().toString(36).slice(2,7); }
function toast(msg){
  let t=document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}
function go(view,bizId){
  if(view==="chat" && bizId && bizId!==STATE.bizId){ STATE.chat=null; }
  STATE.view=view; if(bizId) STATE.bizId=bizId; render();
}
function catIcon(cat){ return {"Hair Salon":"💇","Spa & Wellness":"🧖","Restaurant":"🍽️","Dental Clinic":"🦷","Cafe":"☕","Clinic / GP":"🩺","Nail Studio":"💅","Barbershop":"💈","Tuition Centre":"📚","Car Workshop":"🔧","Photography Studio":"📸","Pet Grooming":"🐾","Gym & Fitness":"🏋️","Laundry Service":"🧺","Bridal Studio":"👰"}[cat] || "🏢"; }
function isMenuCategory(b){ return b.category==="Restaurant" || b.category==="Cafe"; }
const CATEGORIES=["Hair Salon","Spa & Wellness","Restaurant","Cafe","Dental Clinic","Clinic / GP","Nail Studio","Barbershop","Tuition Centre","Car Workshop","Photography Studio","Pet Grooming","Gym & Fitness","Laundry Service","Bridal Studio","Other"];
function distanceKm(lat1,lon1,lat2,lon2){
  const R=6371,toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function findNearby(){
  const btn=document.getElementById("nearby-btn");
  if(btn) btn.textContent="Locating…";
  if(!navigator.geolocation){ toast("Location isn't available in this browser."); if(btn) btn.textContent="📍 Find nearest to me"; return; }
  navigator.geolocation.getCurrentPosition(pos=>{
    STATE.userLoc={lat:pos.coords.latitude,lng:pos.coords.longitude};
    render();
  }, err=>{
    toast("Couldn't access your location — showing all businesses instead.");
    if(btn) btn.textContent="📍 Find nearest to me";
  }, {timeout:8000});
}

/* ---------- RENDER ROOT ---------- */
function render(){
  const app=document.getElementById("app");
  if(STATE.view==="landing") app.innerHTML=viewLanding();
  else if(STATE.view==="signup") app.innerHTML=viewSignup();
  else if(STATE.view==="signupSuccess") app.innerHTML=viewSignupSuccess();
  else if(STATE.view==="dashboard") app.innerHTML=viewDashboard();
  else if(STATE.view==="chat") app.innerHTML=viewChat();
  if(STATE.view==="chat" && !STATE.chat) initChat();
  if(STATE.view==="chat") scrollChat();
}

/* ---------- LANDING ---------- */
function viewLanding(){
  let list=Object.values(DB.businesses);
  if(STATE.userLoc){
    list=list.map(b=>({b,d:(b.lat!=null)?distanceKm(STATE.userLoc.lat,STATE.userLoc.lng,b.lat,b.lng):null}))
             .sort((x,y)=>(x.d??999)-(y.d??999));
  } else {
    list=list.map(b=>({b,d:null}));
  }
  const chips=list.map(({b,d})=>`
    <div class="biz-chip" onclick="go('chat','${b.id}')" title="Chat with ${b.ai.name} now">
      ${b.image?`<img src="${b.image}" style="width:100%;height:90px;object-fit:cover;border-radius:12px;margin-bottom:10px">`

function addUser(text){ STATE.chat.msgs.push({who:"user",text}); }

  const b=biz();
  const msgs=(STATE.chat?STATE.chat.msgs:[]).map(m=>`<div class="msg ${m.who}"><span class="avatar-tag">${m.who==="ai"?"🤖":"🙂"}</span>${m.text}${m.extraHTML||""}</div>`).join("");

        <button class="qa-btn qa-confirm" onclick="quickConfirm()">Confirm Booking</button>

function sendChat(){
  const inp=document.getElementById("chat-in");
  const text=inp.value.trim();
  if(!text) return;
  inp.value="";
  addUser(text);
  handleMessage(text);
  render();
}
function quickConfirm(){ addUser("Confirm Booking"); handleMessage("yes confirm"); render(); }
function quickHuman(){ addUser("Talk to Human"); startHumanTransfer(); render(); }

function startHumanTransfer(){
  STATE.chat.stage="await_reason";
  addAI(`Of course 💬 Could you share your name and briefly what this is about, so our team can help?`);
}

// Simple, generic intent detection — same rules for every business.
function detectIntent(t){
  if(/speak|talk to (a )?(person|someone|human)|representative|agent|human/.test(t)) return "human";
  if(/^(hi|hello|hey|yo|hiya|good\s?morning|good\s?afternoon|good\s?evening|greetings|sup|howdy)\b/.test(t)) return "greeting";
  if(/about (you|your|the company|this business)|who are you|your story|tell me about/.test(t)) return "about";
  if(/hour|open|close|time.*open/.test(t)) return "hours";
  if(/price|cost|how much|service|offer|what do you (do|have)|menu/.test(t)) return "services";
  if(/book|appointment|schedule|reserve|reservation/.test(t)) return "book";
  return "unknown";
}

function handleMessage(text){
  const b=biz(); const t=text.toLowerCase(); const c=STATE.chat;
  b.aiEnquiries=(b.aiEnquiries||0)+1;

  // Mid-flow stages take priority over new intents so the conversation stays coherent.
  if(c.stage==="await_reason"){
    b.enquiries.push({id:uid("e"),customer:text.split(",")[0]||text,reason:text,status:"pending"});
    openTransferModal(b,text);
    c.stage="idle";
    return;
  }
  if(c.stage==="await_service"){
    const match=b.services.find(s=>t.includes(s.name.toLowerCase()));
    if(!match){ addAI(`Just let me know which one — ${b.services.map(s=>s.name).join(", ")}.`); return; }
    c.service=match; showSlots(); return;
  }
  if(c.stage==="await_slot"){ addAI(`Whenever you're ready, just pick one of the times shown above 🕊️`); return; }
  if(c.stage==="await_name"){
    c.name=text; c.stage="await_phone";
    addAI(`Lovely to meet you, ${text} 💫 What's the best phone number to reach you?`);
    return;
  }
  if(c.stage==="await_phone"){
    c.phone=text; c.stage="await_confirm";
    addAI(`Almost there — <strong>${c.service.name}</strong> at <strong>${c.slot}</strong> for ${c.name} (${c.phone}). Shall I confirm, whenever you're ready?`);
    return;
  }
  if(c.stage==="await_confirm"){
    if(/yes|confirm|sure|ok/.test(t)){
      b.bookings.push({id:uid("bk"),customer:c.name,phone:c.phone,service:c.service.name,time:c.slot,status:"confirmed"});
      const slotOnly=c.slot.replace(/^Tomorrow\s*/,"");
      b.slots=(b.slots||[]).filter(s=>s!==slotOnly); // slot is taken immediately, won't be offered again
      const via=[b.notifyPhone&&`text to ${b.notifyPhone}`,b.notifyEmail&&`email to ${b.notifyEmail}`].filter(Boolean).join(" and ");
      addAI(`You're all set 🎉 Your ${c.service.name} is booked for ${c.slot}. See you then.`+(via?` I've also notified ${b.name} (${via}) so they're expecting you.`:''));
      c.service=null; c.slot=null; c.stage="idle";
    } else {
      addAI(`No problem at all 🌿 Just let me know whenever you'd like to try a different time.`);
      c.stage="idle";
    }
    return;
  }

  // Fresh intent, conversation is idle.
  switch(detectIntent(t)){
    case "human":
      startHumanTransfer(); return;
    case "greeting":
      addAI(`Still here 👋 What can I help with — services, hours, or booking?`); return;
    case "about":
      addAI(b.about || b.description || `We haven't added our story yet — happy to connect you with a human who can share more.`); return;
    case "hours":
      addAI(`Here are our hours ⏰<br>`+Object.entries(b.hours).map(([d,h])=>`${d}: ${h}`).join("<br>")); return;
    case "services":
      if(!b.services.length){ addAI(`We haven't listed our ${isMenuCategory(b)?"menu":"services"} yet — I don't have that information. Would you like me to bring in a human?`); return; }
      addAI(isMenuCategory(b)
        ? `Here's our menu, no rush to decide 🌿<br>`+b.services.map(s=>`${s.name} — RM${s.price}`).join("<br>")
        : `Here's what we offer, no rush to decide 🌿<br>`+b.services.map(s=>`${s.name} — RM${s.price} (${s.duration} min)`).join("<br>")); return;
    case "book":
      if(!(b.slots||[]).length){ addAI(`We're fully booked for now — I don't have any open slots to offer. I can bring in a human to find you a time.`); return; }
      if(isMenuCategory(b)){
        c.service={name:"Table Reservation",price:null,duration:null};
        showSlots(); return;
      }
      if(!b.services.length){ addAI(`I'm sorry, we don't have services set up to book just yet — I can bring in a human to help.`); return; }
      { const match=b.services.find(s=>t.includes(s.name.toLowerCase()));
        if(match){ c.service=match; showSlots(); return; } }
      c.stage="await_service";
      addAI(`Sure, take your time — which service would you like? `+b.services.map(s=>s.name).join(", "));
      return;
    default:
      addAI(`I don't have that information on hand just yet — I can check our ${isMenuCategory(b)?"menu":"services"}, prices, hours, or book ${isMenuCategory(b)?"a table":"an appointment"} whenever suits you. I can also bring in a human if you'd like.`);
  }
}

function showSlots(){
  const c=STATE.chat; const b=biz();
  c.stage="await_slot";
  const available=b.slots||[];
  const btns=available.map(s=>`<button class="slot-btn pop" onclick="pickSlot('${s}')">${s}</button>`).join("");
  const intro=c.service.price ? `Great choice — ${c.service.name} (RM${c.service.price}, ${c.service.duration} min). Here's tomorrow's availability, take your time:`
    : `Sure thing — here's tomorrow's availability for a ${c.service.name.toLowerCase()}, take your time:`;
  addAI(intro, `<div class="slots">${btns}</div>`);
  render();
}
function pickSlot(s){
  const c=STATE.chat; const b=biz();
  if(!(b.slots||[]).includes(s)){ addAI(`That time was just taken — please pick another from what's shown.`); render(); return; }
  c.slot="Tomorrow "+s; c.stage="await_name";
  addUser(s);
  addAI(`Would you like me to confirm your ${isMenuCategory(b)?"reservation":"appointment"} for ${c.slot}? First, what's your name?`);
  render();
}

/* ---------- HUMAN TRANSFER MODAL — contact details are business-provided ---------- */
function openTransferModal(b,summary){
  const ht=b.humanTransfer||{};
  const hasContact = ht.contact||ht.phone||ht.email;
  const el=document.getElementById("transfer-modal");
  if(!el) return;
  el.innerHTML=`
  <div class="overlay" onclick="if(event.target===this)closeTransfer()">
    <div class="modal">
      <h3 style="font-family:inherit">Connecting you with a human</h3>
      <div class="row"><span>Business</span><strong>${b.name}</strong></div>
      <div class="row"><span>Reason</span><strong style="text-align:right;max-width:60%">${summary}</strong></div>
      ${hasContact ? `
      <div class="row"><span>Contact</span><strong style="text-align:right;max-width:60%">${ht.contact||"—"}</strong></div>
      <div class="row"><span>Phone</span><strong style="text-align:right">${ht.phone||"—"}</strong></div>
      <div class="row"><span>Email</span><strong style="text-align:right">${ht.email||"—"}</strong></div>
      ${ht.note?`<div class="row" style="border-bottom:none"><span></span><span class="small" style="text-align:right">${ht.note}</span></div>`:""}
      ` : `<div class="row" style="border-bottom:none"><span></span><span class="small">This business hasn't set up handoff contact details yet — your enquiry has still been logged for their team.</span></div>`}
      <div style="margin-top:10px"><span class="badge badge-pending">Pending human pickup</span></div>
      <button class="btn btn-primary" style="margin-top:16px;width:100%" onclick="closeTransfer()">Got it</button>
    </div>
  </div>`;
  addAI(`Thank you — I've passed this along${ht.contact?` to ${ht.contact}`:''} at ${b.name}. ${ht.note||"Someone will follow up with you shortly"} 🙏`);
  render();
}
function closeTransfer(){ document.getElementById("transfer-modal").innerHTML=""; }

render();
setTimeout(()=>{
  const intro=document.getElementById("intro");
  if(intro){
    intro.classList.add("doors-open");
    setTimeout(()=>{ intro.classList.add("intro-hide"); setTimeout(()=>intro.remove(),2400); },2400);
  }
},1700);
</script>
